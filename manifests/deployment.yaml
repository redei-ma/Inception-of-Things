# Manifests consumed by Argo CD from the GitHub repository.
# Argo CD reads this file and applies it into the "dev" namespace,
# keeping the cluster in sync with whatever is committed on the "main" branch.
#
# To switch application version, change the image tag below (v1 <-> v2),
# commit and push: Argo CD will roll the deployment automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  labels:
    app: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playground
          image: wil42/playground:v2
          ports:
            - containerPort: 8888
---
# ClusterIP service exposing the playground pod on port 8888.
# Reach it via `kubectl port-forward svc/playground 8888:8888 -n dev`.
apiVersion: v1
kind: Service
metadata:
  name: playground
spec:
  selector:
    app: playground
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
