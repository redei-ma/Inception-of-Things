# Host-based routing:
#   Host "app1.com" -> app1-service
#   Host "app2.com" -> app2-service
#   any other host  -> app3-service (default, no "host" field)
#
# K3s ships with Traefik as its default Ingress controller,
# so this Ingress is picked up automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
spec:
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80
    # Catch-all: no "host" field means "match any Host header
    # that did not match a previous rule".
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3-service
                port:
                  number: 80
