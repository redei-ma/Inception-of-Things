# app1: single-replica deployment reached when the Ingress receives
# a request with Host header "app1.com".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: traefik/whoami:v1.10.4
          ports:
            - containerPort: 80
          env:
            # Shown at the top of the whoami response, making it easy
            # to tell which app answered the request.
            - name: WHOAMI_NAME
              value: "APP 1"
---
# ClusterIP service exposing app1 pods inside the cluster.
# The Ingress will target this service for host "app1.com".
apiVersion: v1
kind: Service
metadata:
  name: app1-service
spec:
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
