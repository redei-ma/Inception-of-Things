# app2: three-replica deployment reached when the Ingress receives
# a request with Host header "app2.com". The service load-balances
# across the three pods, so consecutive curls should return different
# hostnames.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
  labels:
    app: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: traefik/whoami:v1.10.4
          ports:
            - containerPort: 80
          env:
            - name: WHOAMI_NAME
              value: "APP 2"
---
apiVersion: v1
kind: Service
metadata:
  name: app2-service
spec:
  selector:
    app: app2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
